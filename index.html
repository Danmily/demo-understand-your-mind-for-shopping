<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能挽单案例回放</title>
<meta name="description" content="电商购买意图闭环判断：7 个真实脱敏案例逐步回放">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --soft: #fafbfc; --line: #e4e6eb; --text: #1f2329; --muted: #646a73; --faint: #8f959e;
  --brand: #3370ff; --brand-soft: #e1eaff; --ok: #2ea121; --ok-soft: #e4f5e2; --warn: #e07800; --warn-soft: #fff1e0;
  --bad: #f54a45; --bad-soft: #fde2e2; --run: #7f3bf5; --run-soft: #efe6fe; --hl: #fff7d6; --hl-line: #f5d77a;
  --frame: #1f2329; --shadow: rgba(0,0,0,.10);
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: #1e2127; --soft: #23262d; --line: #33373f; --text: #e8eaed; --muted: #a6abb5; --faint: #7d838e;
    --brand: #5b8cff; --brand-soft: #1f2d4d; --ok: #4cc23f; --ok-soft: #1c3320; --warn: #ffa53d; --warn-soft: #3a2a14;
    --bad: #ff6b66; --bad-soft: #3d1f1f; --run: #a57bff; --run-soft: #2c2142; --hl: #3a3317; --hl-line: #6b5a1f;
    --frame: #050608; --shadow: rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1e2127; --soft: #23262d; --line: #33373f; --text: #e8eaed; --muted: #a6abb5; --faint: #7d838e;
  --brand: #5b8cff; --brand-soft: #1f2d4d; --ok: #4cc23f; --ok-soft: #1c3320; --warn: #ffa53d; --warn-soft: #3a2a14;
  --bad: #ff6b66; --bad-soft: #3d1f1f; --run: #a57bff; --run-soft: #2c2142; --hl: #3a3317; --hl-line: #6b5a1f;
  --frame: #050608; --shadow: rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
.topbar { min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.brand { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 10px; }
.brand small { color: var(--muted); font-weight: 400; font-size: 13px; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #3370ff, #7f3bf5); color: #fff; display: grid; place-items: center; font-size: 13px; flex: none; }
.spacer { flex: 1; }
.chip { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 10px; background: var(--bg); color: var(--muted); white-space: nowrap; line-height: 20px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.brand { background: var(--brand-soft); color: var(--brand); }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; white-space: nowrap; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.panel h3 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); } .faint { color: var(--faint); font-size: 12px; }
.grid { display: grid; grid-template-columns: 270px 380px minmax(0, 1fr); gap: 12px; padding: 12px; align-items: start; max-width: 1500px; margin: 0 auto; }
@media (max-width: 1180px) { .grid { grid-template-columns: 1fr; padding: 12px 16px; } .grid > .mid { order: -1; } }

/* 案例列表 */
.clist { display: grid; gap: 6px; }
.citem { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: var(--panel); text-align: left; font: inherit; color: inherit; width: 100%; }
.citem:hover { border-color: var(--brand); }
.citem.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.citem .t { font-size: 13px; }
.cgrp { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 5px; background: var(--brand-soft); color: var(--brand); margin-right: 4px; }
.cgrp.dim { background: var(--bg); color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kpi { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.kpi .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12px; color: var(--muted); }
.trail { display: grid; gap: 2px; max-height: 260px; overflow: auto; }
.trail .ti { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; font-size: 13px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
.trail .ti:hover { background: var(--bg); } .trail .ti.sel { background: var(--brand-soft); }
.trail .n { color: var(--faint); font-size: 12px; }

/* 手机：模拟的购物 App（通用样式，不对应任何具体平台） */
.phone { width: 340px; max-width: 100%; margin: 0 auto; border: 10px solid var(--frame); border-radius: 38px; background: #fff; overflow: hidden; box-shadow: 0 8px 30px var(--shadow); }
.screen { position: relative; height: 640px; overflow: hidden; background: #f4f4f4; color: #1f2329; font-size: 13px; }
.sbar { height: 26px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-size: 12px; font-weight: 600; background: #fff; }
.sbar.dark { background: transparent; color: #fff; position: absolute; top: 0; left: 0; right: 0; z-index: 3; }
.nav { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #fff; border-bottom: 1px solid #eee; font-weight: 600; }
.nav .bk { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; color: #333; }
.nav .ttl { flex: 1; text-align: center; margin-right: 34px; }
.body { position: absolute; top: 66px; bottom: 54px; left: 0; right: 0; overflow: hidden; }
.body.nobar { bottom: 0; }
.bline { height: 9px; border-radius: 5px; background: #e6e7ea; margin: 6px 0; }
.bline.w60 { width: 60%; } .bline.w80 { width: 80%; } .bline.w40 { width: 40%; }
.card2 { background: #fff; margin: 8px; border-radius: 10px; padding: 10px; }
.ptile { width: 64px; height: 64px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px; flex: none; }
.prow { display: flex; gap: 10px; align-items: center; }
.price { color: #fe2c55; font-weight: 700; }
.price .pm { font-size: 11px; color: #b0b3b8; font-weight: 400; margin-left: 4px; }
.hero { height: 300px; display: grid; place-items: center; color: #fff; font-size: 64px; font-weight: 800; position: relative; }
.hero .idx { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.35); color: #fff; font-size: 11px; border-radius: 10px; padding: 0 8px; font-weight: 400; }
.hero .dots { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 4px; }
.hero .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.5); } .hero .dots i.on { width: 14px; background: #fff; }
.row2 { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #fff; border-bottom: 1px solid #f0f0f0; }
.row2 .k { color: #8f959e; width: 44px; flex: none; } .row2 .v { flex: 1; }
.bbar { position: absolute; left: 0; right: 0; bottom: 0; height: 54px; background: #fff; border-top: 1px solid #eee; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
.bbar .ic { font-size: 10px; color: #646a73; text-align: center; width: 34px; line-height: 1.3; }
.bbar .ic b { display: block; width: 18px; height: 18px; margin: 0 auto 2px; border-radius: 5px; border: 1.5px solid #8f959e; }
.pill { flex: 1; height: 38px; border-radius: 19px; display: grid; place-items: center; color: #fff; font-weight: 600; }
.pill.cart { background: #ffb31a; } .pill.buy { background: #fe2c55; }
.half-top { position: absolute; top: 0; left: 0; right: 0; height: 170px; background: #2b2f36; }
.half-top .bline { background: #3b4048; margin: 10px 14px; }
.half { position: absolute; left: 0; right: 0; top: 150px; bottom: 0; border-radius: 16px 16px 0 0; overflow: hidden; background: #f4f4f4; }
.half .hero { height: 200px; }
/* 直播间 */
.live { position: absolute; inset: 0; background: linear-gradient(180deg, #3a2b45, #1d1f27 60%); color: #fff; }
.live .host { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: 150px; height: 220px; border-radius: 75px 75px 20px 20px; background: rgba(255,255,255,.08); }
.live .tagl { position: absolute; top: 34px; left: 12px; display: flex; gap: 6px; align-items: center; font-size: 12px; }
.live .tagl .av { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.25); }
.live .onair { background: #fe2c55; border-radius: 4px; padding: 0 6px; font-size: 11px; }
.live .cmts { position: absolute; left: 12px; bottom: 210px; display: grid; gap: 6px; }
.live .cmts span { background: rgba(0,0,0,.3); border-radius: 10px; height: 20px; display: block; }
.live .pop { position: absolute; left: 12px; right: 70px; bottom: 70px; background: #fff; color: #1f2329; border-radius: 10px; padding: 8px; display: flex; gap: 8px; align-items: center; }
.live .pop .ptile { width: 54px; height: 54px; font-size: 18px; }
.live .pop .go { margin-left: auto; background: #fe2c55; color: #fff; border-radius: 14px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.live .cartbtn { position: absolute; left: 12px; bottom: 16px; width: 38px; height: 38px; border-radius: 50%; background: #ffb31a; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
/* 规格面板 */
.mask { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 4; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 14px 14px 64px; z-index: 5; animation: up .3s ease; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.sheet .grp { margin-top: 12px; color: #646a73; font-size: 12px; }
.chips2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.chips2 span { border: 1px solid #e4e6eb; background: #f4f4f4; border-radius: 6px; padding: 3px 12px; font-size: 12px; }
.chips2 span.on { border-color: #fe2c55; background: #fff1f3; color: #fe2c55; }
.sheet .ok2 { position: absolute; left: 14px; right: 14px; bottom: 12px; height: 40px; border-radius: 20px; background: #fe2c55; color: #fff; display: grid; place-items: center; font-weight: 600; }
/* 提单 */
.subbar { position: absolute; left: 0; right: 0; bottom: 0; height: 54px; background: #fff; border-top: 1px solid #eee; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 12px; }
.subbar .pill { flex: none; width: 120px; }
.modal { position: absolute; left: 40px; right: 40px; top: 230px; background: #fff; border-radius: 14px; padding: 18px; text-align: center; z-index: 6; box-shadow: 0 8px 30px rgba(0,0,0,.2); animation: in .25s ease; }
.okc { width: 54px; height: 54px; border-radius: 50%; background: #2ea121; color: #fff; display: grid; place-items: center; font-size: 28px; margin: 0 auto 8px; }
/* 点击位置与操作提示 */
.tap { position: relative; }
.tap::after { content: ""; position: absolute; inset: -5px; border: 2.5px solid #3370ff; border-radius: 12px; animation: pulse 1.2s ease-out infinite; pointer-events: none; z-index: 7; }
@keyframes pulse { 0% { opacity: 1; transform: scale(.96); } 100% { opacity: 0; transform: scale(1.06); } }
.finger { position: absolute; z-index: 8; width: 26px; height: 26px; border-radius: 50%; background: rgba(51,112,255,.35); border: 2px solid #3370ff; transform: translate(-50%, -50%); pointer-events: none; animation: press 1.2s ease-out infinite; }
@keyframes press { 0% { transform: translate(-50%, -50%) scale(.6); } 50% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(.6); } }
.toast { position: absolute; left: 10px; right: 10px; top: 72px; background: rgba(20,22,26,.86); color: #fff; border-radius: 10px; padding: 7px 10px; font-size: 12px; z-index: 9; display: flex; gap: 6px; align-items: center; animation: in .25s ease; }
.toast b { background: #3370ff; border-radius: 4px; padding: 0 5px; font-weight: 600; flex: none; }
.swipe { position: absolute; z-index: 8; font-size: 22px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); animation: sw 1.2s ease-in-out infinite; }
@keyframes sw { 0% { transform: translateX(30px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(-30px); opacity: 0; } }
.swipe.v { animation-name: swv; } @keyframes swv { 0% { transform: translateY(30px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
.leaving { animation: out 1.4s ease-in infinite; }
@keyframes out { 0%, 30% { transform: none; opacity: 1; } 100% { transform: translateX(70%); opacity: .2; } }
.idle { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #8f959e; padding: 30px; background: #fff; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.cap { text-align: center; margin-top: 10px; min-height: 22px; font-size: 13px; }
.ctrls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; justify-content: center; }
.thinking { display: none; align-items: center; gap: 8px; color: var(--run); font-size: 13px; }
.thinking.on { display: flex; }
.spin { width: 14px; height: 14px; border: 2px solid var(--run-soft); border-top-color: var(--run); border-radius: 50%; animation: s 1s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }

/* 右侧分析 */
.iv { border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 12px; animation: in .25s ease; }
.iv.主动帮助 { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); } .iv.轻提示 { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn-soft); }
.iv .tt { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px; margin-bottom: 6px; gap: 8px; }
.iv .kv { margin-top: 4px; }
.lv { font-size: 12px; border-radius: 5px; padding: 0 8px; font-weight: 500; white-space: nowrap; }
.lv.主动帮助 { background: var(--brand-soft); color: var(--brand); } .lv.轻提示 { background: var(--warn-soft); color: var(--warn); } .lv.不干预 { background: var(--bg); color: var(--faint); }
.reveal { border: 1px dashed var(--ok); border-radius: 10px; padding: 10px 14px; background: var(--ok-soft); font-size: 13px; margin-bottom: 12px; animation: in .3s ease; }
.reveal .big { font-size: 15px; font-weight: 600; }
.top2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .top2 { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px; font-size: 13px; }
.kv .k { color: var(--muted); }
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.flow .arrow { color: var(--faint); }
.big { font-size: 15px; font-weight: 600; }
.evs { display: flex; gap: 6px; flex-wrap: wrap; }
.ev { background: var(--hl); border: 1px solid var(--hl-line); border-radius: 6px; padding: 0 8px; font-size: 12px; }
.preds { display: grid; gap: 6px; }
.pred { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--bg); }
.pred.hit { background: var(--ok-soft); }
.band { display: inline-block; border-radius: 8px; padding: 2px 12px; font-weight: 600; font-size: 15px; }
.band.b0 { background: var(--bg); color: var(--muted); } .band.b1 { background: var(--brand-soft); color: var(--brand); }
.band.b2 { background: var(--warn-soft); color: var(--warn); } .band.b3 { background: var(--bad-soft); color: var(--bad); }
.band.bok { background: var(--ok-soft); color: var(--ok); }
.band.sm { font-size: 11px; padding: 0 6px; border-radius: 5px; font-weight: 500; }
.band.lg { font-size: 22px; padding: 2px 16px; }
.ladder { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.ladder .stp { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--faint); cursor: pointer; background: none; border: 0; padding: 0; font-family: inherit; }
.ladder .stp.sel .band { outline: 2px solid var(--brand); }
.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--soft); }
.empty { color: var(--faint); text-align: center; padding: 40px 10px; }
.note { font-size: 12px; color: var(--faint); max-width: 1500px; margin: 0 auto; padding: 0 12px 24px; }
@media (max-width: 1180px) { .note { padding: 0 16px 24px; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="logo">挽</div>智能挽单 · 真实案例回放 <small>Qwen3.5-4B + LoRA 第三轮</small></div>
  <div class="spacer"></div>
  <span class="chip">7 个测试集案例 · 已脱敏</span>
</div>

<div class="grid">
  <div>
    <div class="panel">
      <h3>选择案例</h3>
      <div class="clist" id="clist"></div>
    </div>
    <div class="panel">
      <h3>7 个案例截点汇总</h3>
      <div class="kpis" id="kpis"></div>
      <div class="faint" style="margin-top:8px">截点：案例在测试集里的判断位置。下一步预测与截点之后用户的真实动作核对。</div>
    </div>
  </div>

  <div class="mid">
    <div class="phone"><div class="screen" id="screen"></div></div>
    <div class="cap" id="cap"></div>
    <div class="ctrls">
      <button class="btn primary" id="bStep">回放下一步</button>
      <button class="btn" id="bAuto">自动回放到截点</button>
      <button class="btn" id="bReset">重新开始</button>
    </div>
    <div class="panel" style="margin-top:12px">
      <h3>行为轨迹 <span class="chip" id="prog"></span></h3>
      <div class="trail" id="trail"><div class="faint">还没有回放。</div></div>
    </div>
  </div>

  <div id="right"></div>

const HUE = { '商品A': [221, 255], '商品B': [24, 350], '商品C': [150, 190] };
function tile(p, cls = 'ptile') {
  const [a, b] = HUE[p] || [210, 240];
  return `<div class="${cls}" style="background:linear-gradient(135deg,hsl(${a} 70% 58%),hsl(${b} 65% 48%))">${esc((p || '商品').slice(-1))}</div>`;
}

const lines = (n, w = ['', 'w80', 'w60']) => Array.from({ length: n }, (_, i) => `<div class="bline ${w[i % w.length]}"></div>`).join('');

function detailBody(p, o = {}) {
  const n = o.img || 1;
  return `<div class="hero${T(o.tap === 'hero')}" style="background:linear-gradient(135deg,hsl(${(HUE[p] || [210])[0]} 70% 62%),hsl(${(HUE[p] || [0, 240])[1]} 65% 46%))">${esc((p || '商品').slice(-1))}
      <span class="idx">${n}/5</span><div class="dots">${[1, 2, 3, 4, 5].map(i => `<i class="${i === n ? 'on' : ''}"></i>`).join('')}</div></div>

      <div style="font-weight:600;margin-top:2px">${esc(p)} · 商品名已隐去</div><div class="faint">包邮 · 7 天无理由退货</div></div>
    <div class="row2"><span class="k">已选</span><span class="v">请选择规格</span><span>›</span></div>
    <div class="row2${T(o.tap === 'review')}"><span class="k">评价</span><span class="v">用户评价</span><span class="faint">查看全部 ›</span></div>
    <div class="card2">${lines(3)}</div>`;
}
const buyBar = tap => `<div class="bbar"><div class="ic"><b></b>店铺</div><div class="ic"><b></b>客服</div>
  <div class="pill cart">加入购物车</div><div class="pill buy${T(tap === 'buy')}">立即购买</div></div>`;
function detail(p, o = {}) {
  if (o.half) return `<div class="half-top">${sbar(1)}<div style="height:30px"></div>${lines(4)}</div>
    <div class="half"><div style="height:6px;width:40px;border-radius:3px;background:#ccc;margin:6px auto"></div>${detailBody(p, o)}</div>${buyBar(o.tap)}`;
  return `${nav('商品详情', o.tap === 'back')}<div class="body${o.leave ? ' leaving' : ''}">${detailBody(p, o)}</div>${buyBar(o.tap)}`;
}
function live(p, o = {}) {
  return `<div class="live">${sbar(1)}<div class="tagl"><span class="av"></span><span>直播间</span><span class="onair">直播中</span></div>
    <div class="host"></div><div class="cmts"><span style="width:150px"></span><span style="width:110px"></span><span style="width:170px"></span></div>
    <div class="pop${T(o.tap === 'pop')}">${tile(p)}<div><div style="font-weight:600">${esc(p)}</div><div class="price" style="font-size:12px">¥ ···</div><div class="faint">讲解中</div></div><span class="go">去购买</span></div>
    <div class="cartbtn">购</div></div>`;
}
function sku(base, p, o = {}) {
  const col = ['款式一', '款式二', '款式三'], size = ['S', 'M', 'L', 'XL'];
  return `${base}<div class="mask"></div><div class="sheet">
    <div class="prow">${tile(p)}<div><div class="price">¥ ···<span class="pm">价格已隐去</span></div><div class="faint">已选：${o.col != null ? col[o.col] + ' ' + size[o.size ?? 1] : '请选择'}</div></div></div>
    <div class="grp">颜色分类</div><div class="chips2">${col.map((c, i) => `<span class="${i === o.col ? 'on' : ''}${T(o.tap === 'col' && i === o.col)}">${c}</span>`).join('')}</div>
    <div class="grp">尺码</div><div class="chips2">${size.map((c, i) => `<span class="${o.col != null && i === (o.size ?? 1) ? 'on' : ''}">${c}</span>`).join('')}</div>
    <div class="grp">数量</div><div class="chips2"><span>－</span><span>1</span><span>＋</span></div>
    <div class="ok2${T(o.tap === 'ok')}">确定</div></div>`;
}
function checkout(p, o = {}) {
  return `${nav('确认订单', o.tap === 'back')}<div class="body">
    <div class="card2"><div style="font-weight:600">收货地址</div><div class="faint">已隐去</div></div>
    <div class="card2"><div class="prow">${tile(p || '商品A')}<div style="flex:1"><div style="font-weight:600">${esc(p || '商品')}</div><div class="faint">${o.spec ? '已选规格' : '规格：待确认'} · ×1</div></div></div>
      <div class="row2${T(o.tap === 'spec')}" style="padding:8px 0;margin-top:6px"><span class="k">规格</span><span class="v">${o.spec ? '已选择' : '请选择'}</span><span>›</span></div>
      <div class="row2" style="padding:8px 0"><span class="k">优惠</span><span class="v faint">—</span></div>
      <div class="row2" style="padding:8px 0;border:0"><span class="k">运费</span><span class="v">包邮</span></div></div></div>
    <div class="subbar"><span>合计 <span class="price">¥ ···</span></span><div class="pill buy${T(o.tap === 'submit')}">提交订单</div></div>
    ${o.done ? `<div class="mask"></div><div class="modal"><div class="okc">✓</div><b>订单提交成功</b><div class="faint">正在前往支付</div></div>` : ''}`;
}
function reviews(p, o = {}) {
  const r = () => `<div class="card2"><div class="prow"><span style="width:26px;height:26px;border-radius:50%;background:#e6e7ea;display:block"></span><div class="bline w40" style="flex:1"></div></div>${lines(2, ['', 'w80'])}
    <div style="display:flex;gap:6px;margin-top:6px"><span style="width:60px;height:60px;border-radius:6px;background:#e6e7ea"></span><span style="width:60px;height:60px;border-radius:6px;background:#e6e7ea"></span></div></div>`;
  return `${nav('商品评价')}<div class="body nobar"><div class="card2"><div class="chips2"><span class="on">全部</span><span>有图</span><span>追评</span><span>差评</span></div></div>${r()}${r()}${r()}</div>`;
}
function orders(o = {}) {
  const card = p => `<div class="card2"><div class="faint">店铺 · 已隐去</div><div class="prow" style="margin-top:6px">${tile(p)}<div style="flex:1">${lines(2, ['w80', 'w40'])}</div></div></div>`;
  return `${nav('我的订单')}<div class="body nobar"><div class="card2"><div class="chips2"><span class="on">全部</span><span>待支付</span><span>待发货</span><span>待收货</span></div></div>${card('商品A')}${card('商品C')}</div>`;
}
function paid() {
  return `${nav('支付结果')}<div class="body nobar" style="background:#fff;text-align:center;padding-top:80px">
    <div class="okc" style="width:70px;height:70px;font-size:36px">✓</div><div style="font-size:18px;font-weight:600">支付成功</div><div class="faint">金额已隐去</div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:24px"><span class="btn">查看订单</span><span class="btn">继续逛逛</span></div></div>`;
}
function orderDetail(p) {
  return `${nav('订单详情')}<div class="body nobar"><div class="card2" style="background:#fe2c55;color:#fff"><b>待发货</b><div style="font-size:12px;opacity:.85">商家正在备货</div></div>
    <div class="card2"><div class="prow">${tile(p || '商品A')}<div style="flex:1"><b>${esc(p || '商品')}</b>${lines(1, ['w60'])}</div></div></div>
    <div class="card2"><div class="row2" style="padding:6px 0"><span class="k">订单号</span><span class="v faint">已隐去</span></div><div class="row2" style="padding:6px 0;border:0"><span class="k">物流</span><span class="v">暂无物流信息</span></div></div></div>`;
}

// 每一步：画哪个界面、点了哪里、提示什么
function screenFor(c, k) {
  const s = c.steps[k], p = s.商品 || c.steps.find(x => x.商品)?.商品 || '商品A', a = s.动作;
  const prev = c.steps.slice(0, k).reverse();
  const basePage = (prev.find(x => x.页面 !== '电商SKU面板') || {}).页面;
  const fullSeen = prev.some(x => x.动作.includes('上滑到全屏')) || prev.some(x => x.页面 === '提单页' || x.页面 === '直播间');
  let html = '', extra = '';
  switch (s.页面) {
    case '订单列表': html = orders(); break;
    case '直播间': html = live(p, { tap: 'pop' }); break;
    case '商品详情Native':
      if (a.startsWith('进入商品详情')) html = detail(p, { half: true });
      else if (a.includes('上滑到全屏')) { html = detail(p, {}); extra = `<div class="swipe v" style="left:155px;top:330px">↑</div>`; }
      else if (a.includes('点击该商品')) html = detail(p, { tap: 'hero', half: !fullSeen });
      else if (a.includes('主图')) { html = detail(p, { img: 2, half: !fullSeen }); extra = `<div class="swipe" style="left:150px;top:${fullSeen ? 200 : 260}px">‹</div>`; }
      else if (a.includes('评价页')) html = reviews(p);
      else if (a.includes('离开')) html = detail(p, { tap: 'back', leave: true });
      else html = detail(p, {});
      break;
    case '电商SKU面板': {
      const base = basePage === '直播间' ? live(p) : basePage === '提单页' ? checkout(p) : detail(p, {});
      const doneSel = a.includes('完成'), pick = a.includes('选择规格项'), sw = a.includes('切换');
      html = sku(base, p, { col: sw ? 2 : pick || doneSel ? 1 : null, tap: doneSel ? 'ok' : pick || sw ? 'col' : null });
      break;
    }
    case '提单页': {
      const spec = prev.some(x => x.动作 === '完成规格选择');
      if (a.includes('提交订单成功')) html = checkout(p, { spec: true, done: true });
      else if (a.includes('提交订单')) html = checkout(p, { spec, tap: 'submit' });
      else if (a.includes('返回')) html = checkout(p, { spec, tap: 'back' });
      else html = checkout(p, { spec });
      break;
    }
    case '支付成功页': html = paid(); break;
    case '订单详情': html = orderDetail(s.商品); break;
    default: html = detail(p, {});
  }
  const meta = [s.重复 > 1 ? `×${s.重复}` : '', s.停留 ? `停留 ${s.停留} 秒` : ''].filter(Boolean).join(' · ');
  return html + extra + `<div class="toast"><b>#${k + 1}</b><span>${esc(a)}${meta ? ` <span style="opacity:.7">${meta}</span>` : ''}</span></div>`;
}

// ---------- 页面逻辑 ----------
function renderList() {
  $('clist').innerHTML = C.map((c, i) => `<button class="citem${i === cur ? ' sel' : ''}" data-i="${i}">
    <div><span class="cgrp">${esc(c.group)}</span><span class="cgrp dim">${esc(c.kind)}</span><span class="faint">案例${c.no} · ${c.steps.length} 步</span></div>
    <div class="t">${esc(c.title)}</div></button>`).join('');
  document.querySelectorAll('.citem').forEach(b => b.onclick = () => load(+b.dataset.i));
  const last = C.map(c => c.judgments[c.judgments.length - 1]);
  const n = C.length, t1 = last.filter(j => j.hit?.top1).length, t3 = last.filter(j => j.hit?.top3).length;
  const same = C.filter((c, i) => c.gpu && last[i].out && c.gpu['当前场景'] === last[i].out['当前场景']
    && c.gpu['购买意愿']?.['档位'] === last[i].out['购买意愿']?.['档位'] && c.gpu['下一步预测']?.[0] === last[i].out['下一步预测']?.[0]).length;
  $('kpis').innerHTML = [
    [`${t1}/${n}`, '下一步 top-1 命中'], [`${t3}/${n}`, '下一步 top-3 命中'],
    [`${same}/${n}`, '与测试集评测记录一致'], [`${C.filter(c => c.buy_day).length}/${n}`, '截点后当天下单']
  ].map(([v, l]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
}

function load(i) {
  stopAuto(); cur = i; shown = 0; sel = -1;
  renderList(); render();
  try { history.replaceState(null, '', '#' + C[i].no); } catch (e) {}
}
function done() { return shown >= C[cur].steps.length; }
function step() {
  if (busy || done()) return Promise.resolve();
  busy = true; shown++; sel = shown - 1; render(true);
  return new Promise(r => setTimeout(() => { busy = false; render(); r(); }, 900));
}
async function auto() {
  if (timer) return stopAuto();
  timer = true; $('bAuto').textContent = '暂停';
  while (timer && !done()) { await step(); await new Promise(r => setTimeout(r, 900)); }
  stopAuto();
}
function stopAuto() { timer = null; $('bAuto').textContent = '自动回放到截点'; }

function render(thinking) {
  const c = C[cur], n = c.steps.length, k = sel < 0 ? shown - 1 : sel;
  $('prog').textContent = `${shown}/${n} 步`;
  $('bStep').disabled = busy || done();
  $('bReset').disabled = busy || !shown;
  $('screen').innerHTML = shown ? screenFor(c, k)
    : `<div class="idle"><div><div style="font-weight:600;color:#1f2329;margin-bottom:8px">案例${c.no} · ${esc(c.group)}</div>${esc(c.title)}<br><br>点「回放下一步」，按真实顺序重放这位用户在购物 App 里的操作。</div></div>`;
  $('cap').innerHTML = shown ? `<span class="muted">${esc(c.steps[k].页面)}</span> · ${esc(c.steps[k].动作)}${k !== shown - 1 ? ' <span class="chip">查看历史步骤</span>' : ''}` : '';
  $('trail').innerHTML = shown ? c.steps.slice(0, shown).map((s, i) => `<div class="ti${i === k ? ' sel' : ''}" data-k="${i}"><span class="n">#${i + 1}</span><span>${esc(s.动作)}${s.重复 > 1 ? ` <span class="faint">×${s.重复}</span>` : ''}</span>
      ${!(thinking && i === shown - 1) ? band(c.judgments[i].out?.购买意愿?.档位, 'sm') : ''}</div>`).join('') : '<div class="faint">还没有回放。</div>';
  document.querySelectorAll('.trail .ti').forEach(e => e.onclick = () => { sel = +e.dataset.k; render(busy); });
  renderRight(thinking);
}

function renderRight(thinking) {
  const c = C[cur];
  if (!shown) { $('right').innerHTML = `<div class="panel"><div class="empty">回放开始后，这里显示模型每一步的判断：<br>购买意愿高还是低、下一步会做什么，以及该不该干预。</div></div>`; return; }
  const k = sel < 0 ? shown - 1 : sel;
  if (thinking && k === shown - 1) { $('right').innerHTML = `<div class="panel"><div class="thinking on"><div class="spin"></div>模型正在判断第 ${k + 1} 步…</div></div>` + ladder(c, k, thinking); bindLadder(); return; }
  const j = c.judgments[k], o = j.out || {}, wb = o.购买意愿 || {}, wr = o.顾虑判断 || {}, g = j.suggest;
  const nx = o.下一步预测 || [], real = j.hit?.实际;
  let h = '';
  if (g) h += `<div class="iv ${esc(g.级别)}"><div class="tt"><span>建议：${esc(g.策略)}</span><span class="lv ${esc(g.级别)}">${esc(g.级别)}</span></div>
      <div class="kv"><div class="k">判别</div><div>${esc(g.判别)}</div>
      ${g.级别 !== '不干预' ? `<div class="k">措施</div><div>${esc(g.措施)}</div><div class="k">点位</div><div>${esc(g.点位)}</div>` : ''}
      <div class="k">时机</div><div>${esc(g.时机)}</div></div></div>`;
  if (done() && k === c.steps.length - 1) {
    const hit = j.hit || {};
    h += `<div class="reveal"><div class="faint">截点之后的真实行为</div>
      <div class="big">真实下一步：${esc(c.next_action)} ${hit.top1 ? '<span class="chip ok">top-1 命中</span>' : hit.top3 ? '<span class="chip warn">在 top-3 内</span>' : '<span class="chip bad">未命中</span>'}</div>
      <div>截点后当天是否下单：${c.buy_day ? '<b>当天下单</b>' : '未下单'}</div>
      ${c.after?.length ? `<div class="faint">之后：${c.after.map(esc).join(' → ')}</div>` : ''}</div>`;
  }
  h += `<div class="top2"><div class="panel"><h3>购买意愿</h3><div>${band(wb.档位, 'lg')}</div><div class="faint" style="margin-top:6px">${esc(wb.依据)}</div></div>
    <div class="panel"><h3>下一步预测 ${real ? `<span class="chip">真实：${esc(real)}</span>` : '<span class="chip">等下一步揭晓</span>'}</h3>
    <div class="preds">${nx.map((p, i) => `<div class="pred${p === real ? ' hit' : ''}"><span class="faint">${i + 1}</span><span>${esc(p)}</span>${p === real ? '<span class="chip ok">命中</span>' : ''}</div>`).join('')}</div></div></div>`;
  h += ladder(c, k);
  const pp = o.上一步预测 || {};
  h += `<div class="panel"><h3>第 ${k + 1} 步 · 模型判断明细</h3>
    <div class="flow" style="margin-bottom:10px"><span class="muted">上一步预测</span><b>${esc(pp.预测 || '—')}</b><span class="arrow">→</span><span class="muted">实际</span><b>${esc(pp.实际)}</b>
      ${pp.预测 ? (pp.是否命中 === '命中' ? '<span class="chip ok">命中</span>' : '<span class="chip bad">未命中</span>') : ''}</div>
    <div class="kv">
      <div class="k">意图修正</div><div>${esc(o.意图修正)}</div>
      <div class="k">当前场景</div><div><span class="big">${esc(o.当前场景)}</span> ${(o.其他场景 || []).map(s => `<span class="chip">${esc(s)}</span>`).join(' ')}</div>
      <div class="k">依据步骤</div><div class="evs">${(o.依据步骤 || []).map(n => `<span class="ev">#${n}</span>`).join('') || '<span class="faint">—</span>'}</div>
      <div class="k">意图</div><div>${esc(o.意图)}</div>
      <div class="k">顾虑判断</div><div>${esc(wr.结论)}${wr.可能的顾虑 ? ` <span class="faint">${esc(wr.可能的顾虑)}</span>` : ''}</div>
    </div></div>`;
  if (k === c.steps.length - 1 && c.gpu) {
    const gp = c.gpu, rows = [
      ['当前场景', gp.当前场景, o.当前场景], ['购买意愿', gp.购买意愿?.档位, wb.档位],
      ['顾虑判断', gp.顾虑判断?.结论, wr.结论], ['下一步 top-1', gp.下一步预测?.[0], nx[0]],
      ['下一步 top-3', (gp.下一步预测 || []).join('、'), nx.join('、')]];
    h += `<div class="panel"><h3>截点：和测试集评测记录对照</h3><div class="tblwrap"><table><tr><th>字段</th><th>测试集评测（A800 GPU）</th><th>本次回放（本地）</th><th></th></tr>
      ${rows.map(([f, a, b]) => `<tr><td>${f}</td><td>${esc(a)}</td><td>${esc(b)}</td><td>${a === b ? '<span class="chip ok">一致</span>' : '<span class="chip warn">不同</span>'}</td></tr>`).join('')}
      </table></div></div>`;
  }
  $('right').innerHTML = h; bindLadder();
}
function ladder(c, k, thinking) {
  const ready = c.judgments.slice(0, thinking ? shown - 1 : shown);
  if (!ready.length) return '';
  return `<div class="panel"><h3>购买意愿随步骤变化</h3><div class="ladder">${ready.map((x, i) =>
    `<button class="stp${i === k ? ' sel' : ''}" data-k="${i}">${band(x.out?.购买意愿?.档位, 'sm')}#${i + 1}</button>`).join('')}</div>
    <div class="faint" style="margin-top:6px">点某一步，手机和判断都会回到那一步。</div></div>`;
}
function bindLadder() { document.querySelectorAll('.stp').forEach(b => b.onclick = () => { sel = +b.dataset.k; render(busy); }); }

$('bStep').onclick = () => { stopAuto(); step(); };
$('bAuto').onclick = auto;
$('bReset').onclick = () => load(cur);
// #3 打开案例 3；#3-5 直接停在案例 3 的第 5 步
const [h0, h1] = location.hash.slice(1).split('-').map(Number);
load(h0 >= 1 && h0 <= C.length ? h0 - 1 : 0);
if (h1 > 0) { shown = Math.min(h1, C[cur].steps.length); sel = shown - 1; render(); }
</script>
</body>
</html>
